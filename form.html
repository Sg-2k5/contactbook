<!doctype html>
<html>
  <head>
    <meta name="view-transition" content="same-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Book</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="form-container">
      <!--Parent container for the forms-->
      <form id="contact-form" class="contact-form">
        <center><h3>Create contacts</h3></center>
        <div class="form-details">
          <!--Parent container for both label and input field-->
          <label for="name">Name</label
          ><!--label for the name input field-->
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Full Name"
          /><!--Input field for name-->
        </div>
        <div class="form-details">
          <label for="email">Email</label
          ><!--Label for email-->

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email Address"
          /><!--Email input box-->
        </div>
        <div class="form-details">
          <!--Label for phone-details-->
          <label for="phone">Phone</label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Mobile Number"
          /><!--Phone  no input field-->
        </div>
        <div class="form-details">
          <label for="address">Address</label>
          <textarea
            id="address"
            name="address"
            rows="3"
            placeholder="Residential Address"
          ></textarea
          ><!--Input for taking the address input-->
        </div>
        <center>
          <button type="submit" class="save-contacts">Save Contacts</button
          ><!--Save contacts button  in the bottom center of the form page-->
        </center>
      </form>
    </main>
    <button
      onclick="window.location.href = 'index.html'"
      type="button"
      class="display-contact-btn"
    >
      All Contacts
    </button>
    <script src="script.js"></script>
  </body>
</html>
