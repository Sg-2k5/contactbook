<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TItle of the page -->
    <title>Contactbook</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search"
    />
    <!--Invoking api for search Icon-->
  </head>
  <body>
    <!-- Header bar containing the contactbook heading and search bar -->
    <header class="topbar">
      <div class="logo-area">
        <!--Telephone logo-->
        <img
          src="https://www.svgrepo.com/show/205094/telephone-call-telephone.svg"
          alt="phone"
          width="20"
          height="20"
        />
        Contact Book
      </div>
      <!--Svg icon for the contactbook header page-->
      <!-- form search icon  and a placeholder-->
    </header>
    <section class="toolbar">
      <!--contains searchbox and add contacts button-->
      <form class="search-form">
        <div class="search">
          <span class="material-symbols-outlined">search</span>
          <input
            class="search-input"
            type="search"
            placeholder="Search Contacts"
          />
        </div>
      </form>
      <button type="button" class="add-contact-btn" id="create-contact">
        create contact
      </button>
      <button type="button" class="bulk-delete-btn" id="bulk-delete-btn">
        delete selected
      </button>
    </section>
    <div id="modal-overlay" class="hidden">
      <!--Parent container for the forms-->
      <form id="contact-form" class="contact-form">
        <button id="close-btn" type="button">&times;</button>
        <center><h3>Create contacts</h3></center>
        <div class="form-details">
          <!--Parent container for both label and input field-->
          <label for="name">Name</label
          ><!--label for the name input field-->
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Full Name"
          /><!--Input field for name-->
        </div>
        <div class="form-details">
          <label for="email">Email</label
          ><!--Label for email-->

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email Address"
          /><!--Email input box-->
        </div>
        <div class="form-details">
          <!--Label for phone-details-->
          <label for="phone">Phone</label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Mobile Number"
          /><!--Phone  no input field-->
        </div>
        <div class="form-details">
          <label for="address">Address</label>
          <textarea
            id="address"
            name="address"
            placeholder="Residential Address"
          ></textarea
          ><!--Input for taking the address input-->
        </div>
        <center>
          <button type="submit" class="save-contacts">Save Contacts</button
          ><!--Save contacts button  in the bottom center of the form page-->
        </center>
      </form>
    </div>
    <!-- Storing List of contacts as the main content -->
    <main class="contact-list"></main>
    <script src="script.js"></script>
  </body>
</html>
